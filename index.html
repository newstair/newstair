<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Viewer — просмотр .dae</title>
<style>
  :root{
    --bg:#0f1116; --panel:rgba(22,25,33,.92);
    --border:rgba(255,255,255,.09); --border-str:rgba(255,255,255,.16);
    --text:#e9edf5; --muted:#8b95a8;
    --accent:#5b8cff; --accent-2:#31d0aa; --danger:#ff6b6b;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{font-family:'Inter','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
    background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased;}
  #canvas{display:block;width:100%;height:100%;outline:none;cursor:grab;touch-action:none;}
  #canvas:active{cursor:grabbing;}
  #canvas.ruler-mode{cursor:crosshair;}
  #canvas.human-mode{cursor:pointer;}

  .brand{position:fixed;top:18px;left:18px;display:flex;align-items:center;gap:12px;
    padding:10px 16px 10px 12px;background:var(--panel);border:1px solid var(--border);
    border-radius:var(--radius);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    z-index:20;pointer-events:none;user-select:none;}
  .logo{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));font-size:17px;
    color:#0b0d12;font-weight:800;box-shadow:0 4px 16px rgba(91,140,255,.35);}
  .brand h1{margin:0;font-size:14px;font-weight:650;}
  .brand p{margin:2px 0 0;font-size:11px;color:var(--muted);}

  .panel{position:fixed;top:18px;right:18px;width:270px;padding:14px;
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    z-index:20;display:flex;flex-direction:column;gap:9px;
    max-height:calc(100vh - 36px);overflow-y:auto;
    transition:transform .25s ease, opacity .25s ease;}
  .panel::-webkit-scrollbar{width:6px;}
  .panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px;}
  .panel.hidden{transform:translateX(calc(100% + 30px));opacity:0;pointer-events:none;}
  .panel-title{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;
    color:var(--muted);font-weight:600;margin-bottom:2px;margin-top:6px;}
  .panel-title:first-child{margin-top:0;}
  .row{display:flex;gap:8px;} .row > .btn{flex:1;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:9px 10px;font-family:inherit;font-size:12px;font-weight:550;color:var(--text);
    background:rgba(255,255,255,.055);border:1px solid var(--border);border-radius:10px;
    cursor:pointer;transition:background .16s,border-color .16s,transform .1s,color .16s;
    white-space:nowrap;-webkit-user-select:none;user-select:none;}
  .btn:hover{background:rgba(255,255,255,.1);border-color:var(--border-str);}
  .btn:active{transform:scale(.97);}
  .btn.primary{background:linear-gradient(135deg,var(--accent),#4a76e8);
    border-color:transparent;color:#fff;box-shadow:0 6px 18px rgba(91,140,255,.3);}
  .btn.primary:hover{filter:brightness(1.08);}
  .btn.active{background:rgba(91,140,255,.22);border-color:rgba(91,140,255,.55);color:#b9cdff;}
  .btn.ruler-on{background:linear-gradient(135deg,#ff9f43,#ff7043);
    border-color:transparent;color:#fff;
    box-shadow:0 6px 18px rgba(255,112,67,.35);}
  .btn.human-on{background:linear-gradient(135deg,#31d0aa,#1e9e80);
    border-color:transparent;color:#fff;
    box-shadow:0 6px 18px rgba(49,208,170,.35);}
  .btn .ico{font-size:13px;line-height:1;}
  .divider{height:1px;background:var(--border);margin:3px 0;}
  .color-row{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:6px 8px 6px 12px;background:rgba(255,255,255,.04);border:1px solid var(--border);
    border-radius:10px;font-size:12px;color:var(--muted);}
  input[type="color"]{-webkit-appearance:none;appearance:none;width:44px;height:26px;
    padding:0;border:none;border-radius:7px;background:transparent;cursor:pointer;overflow:hidden;}
  input[type="color"]::-webkit-color-swatch-wrapper{padding:0;}
  input[type="color"]::-webkit-color-swatch{border:1px solid var(--border-str);border-radius:7px;}

  .slider-row{display:flex;flex-direction:column;gap:6px;
    padding:10px 12px;background:rgba(255,255,255,.04);border:1px solid var(--border);
    border-radius:10px;}
  .slider-label{display:flex;justify-content:space-between;align-items:center;
    font-size:11px;color:var(--muted);}
  .slider-label b{color:var(--accent-2);font-size:13px;font-weight:700;}
  input[type="range"].heightSlider{
    -webkit-appearance:none;appearance:none;width:100%;height:6px;
    background:rgba(255,255,255,.12);border-radius:3px;outline:none;cursor:pointer;
  }
  input[type="range"].heightSlider::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:22px;height:22px;border-radius:50%;
    background:linear-gradient(135deg,#31d0aa,#1e9e80);
    border:2px solid #0f1116;cursor:pointer;
    box-shadow:0 2px 8px rgba(49,208,170,.5);
  }
  input[type="range"].heightSlider::-moz-range-thumb{
    width:22px;height:22px;border-radius:50%;
    background:linear-gradient(135deg,#31d0aa,#1e9e80);
    border:2px solid #0f1116;cursor:pointer;
    box-shadow:0 2px 8px rgba(49,208,170,.5);
  }

  .panel-toggle{position:fixed;top:18px;right:18px;width:44px;height:44px;
    display:none;align-items:center;justify-content:center;
    background:var(--panel);border:1px solid var(--border);
    border-radius:12px;color:var(--text);font-size:20px;
    cursor:pointer;z-index:21;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    transition:transform .15s, background .15s;
    -webkit-user-select:none;user-select:none;}
  .panel-toggle:hover{background:rgba(255,255,255,.1);}
  .panel-toggle:active{transform:scale(.94);}
  .panel-toggle.active{background:rgba(91,140,255,.25);
    border-color:rgba(91,140,255,.5);color:#b9cdff;}

  .info{position:fixed;left:18px;bottom:18px;min-width:212px;padding:12px 14px;
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:20;font-size:12px;
    display:flex;flex-direction:column;gap:6px;opacity:0;transform:translateY(12px);
    pointer-events:none;transition:opacity .3s,transform .3s;}
  .info.show{opacity:1;transform:none;pointer-events:auto;}
  .info-row{display:flex;justify-content:space-between;gap:18px;}
  .info-row span{color:var(--muted);}
  .info-row b{font-weight:600;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .info-head{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:2px;}

  .loading{position:fixed;inset:0;z-index:55;display:grid;place-items:center;
    background:rgba(10,12,18,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s;}
  .loading.show{opacity:1;visibility:visible;}
  .spinner{width:44px;height:44px;border:3px solid rgba(255,255,255,.12);
    border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;
    margin:0 auto 16px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading p{margin:0;font-size:13px;color:var(--muted);text-align:center;}

  .toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);
    padding:12px 20px;background:rgba(30,34,44,.96);border:1px solid var(--border-str);
    border-left:3px solid var(--danger);border-radius:11px;font-size:13px;color:var(--text);
    z-index:80;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
    box-shadow:0 12px 36px rgba(0,0,0,.45);max-width:min(90vw,460px);}
  .toast.show{opacity:1;transform:translate(-50%,0);}
  .toast.ok{border-left-color:var(--accent-2);}

  .progress{position:fixed;left:0;right:0;top:0;height:3px;z-index:70;
    background:transparent;pointer-events:none;opacity:0;transition:opacity .3s;}
  .progress.show{opacity:1;}
  .progress-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent-2));
    transition:width .15s ease;}

  .mode-hint{position:fixed;left:50%;top:24px;transform:translateX(-50%);
    padding:10px 18px;color:#fff;border-radius:12px;font-size:13px;font-weight:600;
    z-index:75;opacity:0;pointer-events:none;transition:opacity .25s;}
  .mode-hint.show{opacity:1;}
  .mode-hint.ruler{background:linear-gradient(135deg,#ff9f43,#ff7043);
    box-shadow:0 8px 24px rgba(255,112,67,.4);}
  .mode-hint.human{background:linear-gradient(135deg,#31d0aa,#1e9e80);
    box-shadow:0 8px 24px rgba(49,208,170,.4);}

  @media (max-width:640px){
    .brand{padding:8px 12px 8px 8px;top:12px;left:12px;}
    .brand h1{font-size:12px;} .brand p{display:none;}
    .logo{width:28px;height:28px;font-size:14px;border-radius:8px;}

    .panel-toggle{display:flex;top:12px;right:12px;width:40px;height:40px;font-size:18px;}

    .panel{top:auto;bottom:12px;right:12px;left:12px;width:auto;
      flex-direction:row;flex-wrap:wrap;gap:6px;padding:10px;max-height:60vh;
      transform:translateY(calc(100% + 30px));opacity:0;pointer-events:none;}
    .panel.open{transform:translateY(0);opacity:1;pointer-events:auto;}
    .panel .btn{font-size:11px;padding:8px 6px;flex:1 1 auto;min-width:80px;}
    .panel .row{flex:1 1 100%;}
    .panel-title{flex:1 1 100%;margin-top:0;font-size:9px;}
    .divider{flex:1 1 100%;}
    .color-row{flex:1 1 100%;}
    .slider-row{flex:1 1 100%;}
    .info{display:none;}
    .mode-hint{top:auto;bottom:80px;font-size:12px;padding:8px 14px;}
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<header class="brand">
  <div class="logo">◈</div>
  <div>
    <h1>3D Viewer</h1>
    <p>Просмотр Collada (.dae)</p>
  </div>
</header>

<button class="panel-toggle" id="panelToggle" title="Настройки" aria-label="Настройки">⚙</button>

<aside class="panel hidden" id="panel">
  <div class="panel-title">Общее</div>

  <button class="btn primary" id="btnOpen"><span class="ico">📂</span> Открыть .dae</button>

  <div class="row">
    <button class="btn" id="btnFit" title="Вписать (F)"><span class="ico">⛶</span> Вписать</button>
    <button class="btn" id="btnRotate" title="Автовращение (R)"><span class="ico">⟳</span> Вращение</button>
  </div>

  <div class="panel-title">Элементы модели</div>

  <div class="row">
    <button class="btn active" id="el_treads" title="Ступени"><span class="ico">🪵</span> Ступени</button>
    <button class="btn active" id="el_risers" title="Подступенки"><span class="ico">📐</span> Подступенки</button>
  </div>

  <div class="row">
    <button class="btn active" id="el_stringers" title="Тетивы"><span class="ico">🏗</span> Тетивы</button>
    <button class="btn active" id="el_railing" title="Ограждение"><span class="ico">🛡</span> Огражд.</button>
  </div>

  <div class="row">
    <button class="btn active" id="el_wall" title="Стена"><span class="ico">🧱</span> Стена</button>
    <button class="btn active" id="el_opening" title="Проём"><span class="ico">🪟</span> Проём</button>
  </div>

  <div class="row">
    <button class="btn active" id="el_floor" title="Пол"><span class="ico">🌳</span> Пол</button>
    <button class="btn active" id="btnGlass" title="Прозрачные стены"><span class="ico">◇</span> Стекло</button>
  </div>

  <div class="panel-title">Инструменты</div>

  <div class="row">
    <button class="btn" id="btnRuler" title="Линейка (M)"><span class="ico">📏</span> Линейка</button>
    <button class="btn" id="btnRulerClear" title="Очистить замеры"><span class="ico">✕</span> Очистить</button>
  </div>

  <div class="row">
    <button class="btn" id="btnHuman" title="Человечек"><span class="ico">🧍</span> Человечек</button>
    <button class="btn" id="btnHumanRemove" title="Убрать человечка"><span class="ico">✕</span> Убрать</button>
  </div>

  <div class="slider-row">
    <div class="slider-label">
      <span>Рост человека</span>
      <b id="heightValue">185 см</b>
    </div>
    <input type="range" id="heightSlider" class="heightSlider"
           min="165" max="195" step="5" value="185">
  </div>

  <div class="divider"></div>

  <div class="row">
    <button class="btn" id="btnShot"><span class="ico">📷</span> Снимок</button>
    <button class="btn" id="btnShare"><span class="ico">🔗</span> Поделиться</button>
  </div>

  <button class="btn" id="btnReset"><span class="ico">↺</span> Сброс</button>

  <label class="color-row">
    <span>Цвет фона</span>
    <input type="color" id="bgColor" value="#0f1116">
  </label>
</aside>

<div class="info" id="info">
  <div class="info-head">Модель</div>
  <div class="info-row"><span>Файл</span><b id="iFile">—</b></div>
  <div class="info-row"><span>Объектов</span><b id="iMeshes">0</b></div>
  <div class="info-row"><span>Вершин</span><b id="iVerts">0</b></div>
  <div class="info-row"><span>Треугольников</span><b id="iTris">0</b></div>
  <div class="info-row"><span>Габариты</span><b id="iSize">—</b></div>
  <div class="info-row" id="animRow" style="display:none"><span>Анимаций</span><b id="iAnims">0</b></div>
</div>

<div class="loading" id="loading">
  <div>
    <div class="spinner"></div>
    <p id="loadingText">Загрузка модели…</p>
  </div>
</div>

<div class="progress" id="progress"><div class="progress-bar" id="progressBar"></div></div>
<div class="mode-hint" id="rulerHint">📏 Режим линейки: тапните по двум точкам модели</div>
<div class="mode-hint human" id="humanHint">🧍 Тапните по ступени, чтобы поставить человечка</div>
<div class="toast" id="toast"></div>

<input type="file" id="fileInput" multiple
       accept=".dae,.xml,image/*,.jpg,.jpeg,.png,.gif,.bmp,.tga,.webp"
       style="display:none">

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script><script type="module">
import * as THREE from 'three';
import { OrbitControls }  from 'three/addons/controls/OrbitControls.js';
import { ColladaLoader }  from 'three/addons/loaders/ColladaLoader.js';

/* ═══════════════════════════════════════════════════════════════
   ★ ЗДЕСЬ МЕНЯЕТЕ ИМЯ МОДЕЛИ ★
   ═══════════════════════════════════════════════════════════════ */
const MODEL_FILE = 'Korobitsyno.dae';

/* Единицы. Модель в метрах → 1.0. В мм → 0.001. В см → 0.01. */
const UNIT_SCALE = 1.0;
/* ═══════════════════════════════════════════════════════════════ */

/* ---------- DOM ---------- */
const canvas      = document.getElementById('canvas');
const loadingEl   = document.getElementById('loading');
const loadingTxt  = document.getElementById('loadingText');
const toastEl     = document.getElementById('toast');
const infoEl      = document.getElementById('info');
const panelEl     = document.getElementById('panel');
const panelToggle = document.getElementById('panelToggle');
const fileInput   = document.getElementById('fileInput');
const progress    = document.getElementById('progress');
const progressBar = document.getElementById('progressBar');
const rulerHint   = document.getElementById('rulerHint');
const humanHint   = document.getElementById('humanHint');
const heightSlider= document.getElementById('heightSlider');
const heightValue = document.getElementById('heightValue');

const ui = {
  file:   document.getElementById('iFile'),
  meshes: document.getElementById('iMeshes'),
  verts:  document.getElementById('iVerts'),
  tris:   document.getElementById('iTris'),
  size:   document.getElementById('iSize'),
  anims:  document.getElementById('iAnims'),
  animRow:document.getElementById('animRow'),
};

function isMobile() {
  return window.matchMedia('(max-width:640px)').matches;
}

/* ---------- Рендерер ---------- */
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#0f1116');

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 10000);
camera.position.set(4, 3, 5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.075;
controls.rotateSpeed = 0.9;
controls.panSpeed = 0.8;
controls.zoomSpeed = 1.0;
controls.screenSpacePanning = true;
controls.autoRotateSpeed = 1.6;

controls.addEventListener('start', () => {
  if (isMobile() && panelEl.classList.contains('open')) {
    panelEl.classList.remove('open');
    panelToggle.classList.remove('active');
  }
});

scene.add(new THREE.HemisphereLight(0xdfe9ff, 0x2a2f3a, 1.6));

const keyLight = new THREE.DirectionalLight(0xffffff, 2.6);
keyLight.position.set(5, 9, 7);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.bias = -0.0006;
keyLight.shadow.normalBias = 0.02;
scene.add(keyLight, keyLight.target);

const fillLight = new THREE.DirectionalLight(0xa8c4ff, 0.9);
fillLight.position.set(-7, 4, -6);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffffff, 0.6);
rimLight.position.set(0, -6, -4);
scene.add(rimLight);

/* ---------- Сетка ---------- */
let gridHelper = null;
let gridVisible = false;

function buildGrid(radius, yPos) {
  if (gridHelper) {
    scene.remove(gridHelper);
    gridHelper.geometry.dispose();
    gridHelper.material.dispose();
  }
  const size = Math.max(radius * 6, 1);
  gridHelper = new THREE.GridHelper(size, 20, 0x4a5568, 0x272c37);
  gridHelper.material.transparent = true;
  gridHelper.material.opacity = 0.55;
  gridHelper.material.depthWrite = false;
  gridHelper.position.y = yPos;
  gridHelper.visible = gridVisible;
  scene.add(gridHelper);
}

/* ---------- Состояние ---------- */
let currentModel = null;
let currentMixer = null;
let objectUrls   = [];
const fileMap    = new Map();

const elementGroups = {
  treads: [], risers: [], stringers: [], railing: [],
  wall: [], opening: [], floor: [],
};

const elementVisible = {
  treads: true, risers: true, stringers: true, railing: true,
  wall: true, opening: true, floor: true,
};

let glassWalls = true;

const WALL_OPACITY    = 0.15;
const WINDOW_OPACITY  = 0.55;
const OPENING_OPACITY = 0.2;

/* ---------- Линейка ---------- */
let rulerMode = false;
let rulerPoints = [];
const rulerGroup = new THREE.Group();
scene.add(rulerGroup);

const rulerLineMat = new THREE.LineBasicMaterial({ color: 0xff7043 });
const rulerDotMat  = new THREE.MeshBasicMaterial({ color: 0xff9f43 });
const rulerDotGeo  = new THREE.SphereGeometry(0.03, 12, 12);

const raycaster = new THREE.Raycaster();
const pointer   = new THREE.Vector2();

/* Все вершины модели — для привязки */
const allVertices = [];   // массив Vector3 (world coords)

/* Подсветка — кружок, который следует за мышью */
const snapDotGeo = new THREE.SphereGeometry(0.05, 16, 16);
const snapDotMat = new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.85 });
const snapDot = new THREE.Mesh(snapDotGeo, snapDotMat);
snapDot.visible = false;
snapDot.renderOrder = 1000;
scene.add(snapDot);

const SNAP_RADIUS = 0.05;   // 5 см в метрах

/* ---------- Человечек ---------- */
let humanMode = false;
let humanHeight = 185;      // в см
const humanGroup = new THREE.Group();
humanGroup.visible = false;
scene.add(humanGroup);

const humanBodyMat = new THREE.MeshStandardMaterial({
  color: 0x31d0aa, roughness: 0.55, metalness: 0.05,
  emissive: 0x0a3a2e, emissiveIntensity: 0.25
});
const humanHeadMat = new THREE.MeshStandardMaterial({
  color: 0x4be0bc, roughness: 0.5, metalness: 0.05,
  emissive: 0x0a3a2e, emissiveIntensity: 0.25
});

function makeHumanFigure(heightCm) {
  // Очищаем
  while (humanGroup.children.length) {
    const c = humanGroup.children.pop();
    if (c.geometry) c.geometry.dispose();
  }

  // Модель в метрах, рост в см → метры
  const h = (heightCm / 100) * UNIT_SCALE;
  // Пропорции: голова ~1/7.5 роста
  const headR   = h * 0.065;
  const neckH   = h * 0.025;
  const torsoH  = h * 0.30;
  const pelvisH = h * 0.06;
  const legH    = h * 0.47;
  const armH    = h * 0.32;
  const bodyR   = h * 0.085;

  // Ноги (2 цилиндра)
  const legR = h * 0.035;
  const legGeo = new THREE.CylinderGeometry(legR, legR * 1.15, legH, 16);
  const legL = new THREE.Mesh(legGeo, humanBodyMat);
  legL.position.set(-bodyR * 0.55, legH / 2, 0);
  legL.castShadow = true;
  humanGroup.add(legL);
  const legR_ = new THREE.Mesh(legGeo, humanBodyMat);
  legR_.position.set(bodyR * 0.55, legH / 2, 0);
  legR_.castShadow = true;
  humanGroup.add(legR_);

  // Таз
  const pelvisGeo = new THREE.SphereGeometry(bodyR * 0.95, 20, 14);
  const pelvis = new THREE.Mesh(pelvisGeo, humanBodyMat);
  pelvis.scale.y = 0.6;
  pelvis.position.set(0, legH + pelvisH * 0.4, 0);
  pelvis.castShadow = true;
  humanGroup.add(pelvis);

  // Туловище
  const torsoGeo = new THREE.CylinderGeometry(bodyR * 0.95, bodyR * 1.05, torsoH, 20);
  const torso = new THREE.Mesh(torsoGeo, humanBodyMat);
  torso.position.set(0, legH + pelvisH * 0.8 + torsoH / 2, 0);
  torso.castShadow = true;
  humanGroup.add(torso);

  // Плечи
  const shoulderGeo = new THREE.SphereGeometry(bodyR * 1.05, 20, 14);
  const shoulders = new THREE.Mesh(shoulderGeo, humanBodyMat);
  shoulders.scale.set(1.3, 0.55, 1);
  const shoulderY = legH + pelvisH * 0.8 + torsoH;
  shoulders.position.set(0, shoulderY, 0);
  shoulders.castShadow = true;
  humanGroup.add(shoulders);

  // Руки (2 цилиндра)
  const armR = h * 0.025;
  const armGeo = new THREE.CylinderGeometry(armR, armR * 0.9, armH, 12);
  const armL = new THREE.Mesh(armGeo, humanBodyMat);
  armL.position.set(-bodyR * 1.35, shoulderY - armH / 2 + h * 0.02, 0);
  armL.rotation.z = 0.12;
  armL.castShadow = true;
  humanGroup.add(armL);
  const armR_ = new THREE.Mesh(armGeo, humanBodyMat);
  armR_.position.set(bodyR * 1.35, shoulderY - armH / 2 + h * 0.02, 0);
  armR_.rotation.z = -0.12;
  armR_.castShadow = true;
  humanGroup.add(armR_);

  // Шея
  const neckGeo = new THREE.CylinderGeometry(h * 0.022, h * 0.024, neckH, 12);
  const neck = new THREE.Mesh(neckGeo, humanBodyMat);
  neck.position.set(0, shoulderY + neckH / 2 + h * 0.005, 0);
  neck.castShadow = true;
  humanGroup.add(neck);

  // Голова
  const headGeo = new THREE.SphereGeometry(headR, 24, 18);
  const head = new THREE.Mesh(headGeo, humanHeadMat);
  head.position.set(0, shoulderY + neckH + headR, 0);
  head.castShadow = true;
  humanGroup.add(head);

  // Подпись с ростом — рядом с головой
  humanGroup.add(makeHeightLabel(heightCm, shoulderY + neckH + headR * 2.2));

  // Обновляем глобальную высоту макушки (для позиционирования на ступени)
  humanGroup.userData.topY = shoulderY + neckH + headR * 2;
}

function makeHeightLabel(text, yPos) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const dpr = 2;
  const W = 200, H = 60;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  ctx.fillStyle = 'rgba(20, 22, 30, 0.92)';
  ctx.strokeStyle = '#31d0aa';
  ctx.lineWidth = 2;
  const r = 12;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(W - r, 0);
  ctx.quadraticCurveTo(W, 0, W, r);
  ctx.lineTo(W, H - r);
  ctx.quadraticCurveTo(W, H, W - r, H);
  ctx.lineTo(r, H);
  ctx.quadraticCurveTo(0, H, 0, H - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#4be0bc';
  ctx.font = '700 26px Inter, Segoe UI, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text + ' см', W / 2, H / 2 + 1);

  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();

  const mat = new THREE.SpriteMaterial({
    map: tex, depthTest: false, depthWrite: false, transparent: true
  });
  const sprite = new THREE.Sprite(mat);
  sprite.position.set(0, yPos + 0.15, 0);
  sprite.scale.set(0.55, 0.165, 1);
  return sprite;
}

function setHumanHeight(cm) {
  humanHeight = cm;
  heightValue.textContent = cm + ' см';
  makeHumanFigure(cm);
}

/* ---------- Классификация материалов ---------- */
function classifyMaterial(matName) {
  if (!matName) return null;
  const n = matName.toUpperCase();
  if (n.includes('TREAD'))         return 'treads';
  if (n.includes('RISER'))         return 'risers';
  if (n.includes('STRING'))        return 'stringers';
  if (n.includes('HANDRAIL'))      return 'railing';
  if (n.includes('BALUSTER'))      return 'railing';
  if (n.includes('POST'))          return 'railing';
  if (n.includes('BOTTOMRAIL'))    return 'railing';
  if (n.includes('BEGIN_WALL'))    return 'wall';
  if (n.includes('BEGIN_OPENING')) return 'opening';
  if (n.includes('PARKETT'))       return 'floor';
  if (n.includes('ASH'))           return 'floor';
  if (n.includes('OBJECT3D'))      return 'floor';
  return null;
}

function isWindowTexture(matName) {
  if (!matName) return false;
  return matName.toLowerCase().includes('window');
}

/* ---------- LoadingManager ---------- */
const manager = new THREE.LoadingManager();
manager.setURLModifier((url) => {
  if (url.startsWith('blob:') || url.startsWith('data:')) return url;
  const decoded = decodeURIComponent(url).split('?')[0].split('#')[0];
  const base    = decoded.split('/').pop().toLowerCase();
  if (fileMap.has(base))  return fileMap.get(base);
  if (fileMap.has(decoded.toLowerCase())) return fileMap.get(decoded.toLowerCase());
  return url;
});

/* ---------- Загрузка ---------- */
function showProgress(v) {
  if (v <= 0 || v >= 100) { progress.classList.remove('show'); return; }
  progress.classList.add('show');
  progressBar.style.width = v + '%';
}

function handleFiles(fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;
  const daeFile = files.find(f => /\.(dae|xml)$/i.test(f.name));
  if (!daeFile) { showToast('Не найден файл формата .dae'); return; }

  objectUrls.forEach(u => URL.revokeObjectURL(u));
  objectUrls = [];
  fileMap.clear();

  for (const f of files) {
    if (f === daeFile) continue;
    const url = URL.createObjectURL(f);
    objectUrls.push(url);
    fileMap.set(f.name.toLowerCase(), url);
    if (f.webkitRelativePath) fileMap.set(f.webkitRelativePath.toLowerCase(), url);
  }
  const daeUrl = URL.createObjectURL(daeFile);
  objectUrls.push(daeUrl);
  loadCollada(daeUrl, daeFile.name);
}

function loadCollada(url, fileName) {
  setLoading(true, `Загрузка «${fileName}»…`);
  showProgress(5);

  for (const k in elementGroups) elementGroups[k] = [];
  clearRuler();
  allVertices.length = 0;

  const loader = new ColladaLoader(manager);
  loader.load(url,
    (collada) => {
      setLoading(false);
      showProgress(0);
      const model = collada.scene;
      if (!model) { showToast('Файл не содержит сцены'); return; }

      if (currentModel) {
        scene.remove(currentModel);
        disposeObject(currentModel);
        currentModel = null;
      }
      if (currentMixer) { currentMixer.stopAllAction(); currentMixer = null; }

      let meshCount = 0, vertCount = 0, triCount = 0;
      const seenGeom = new Set();

      model.traverse((obj) => {
        if (!obj.isMesh && !obj.isSkinnedMesh) return;
        obj.castShadow = true;
        obj.receiveShadow = true;
        obj.frustumCulled = false;

        if (obj.geometry && !seenGeom.has(obj.geometry)) {
          seenGeom.add(obj.geometry);
          const g = obj.geometry;
          const pos = g.attributes.position;
          if (pos) vertCount += pos.count;
          triCount += g.index ? g.index.count / 3 : (pos ? pos.count / 3 : 0);
        }
        meshCount++;

        const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
        mats.forEach((m) => {
          if (!m) return;
          ['map','emissiveMap','specularMap','normalMap','aoMap','alphaMap'].forEach((k) => {
            if (m[k] && m[k].isTexture) {
              if (k === 'map' || k === 'emissiveMap') m[k].colorSpace = THREE.SRGBColorSpace;
              m[k].anisotropy = renderer.capabilities.getMaxAnisotropy();
            }
          });
          m.needsUpdate = true;
        });

        const matName = mats[0] && mats[0].name ? mats[0].name : '';
        const group = classifyMaterial(matName);
        if (group) {
          elementGroups[group].push(obj);
          if (group === 'wall' && isWindowTexture(matName)) obj.userData.isWindow = true;
        }
      });

      model.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(model);
      if (box.isEmpty()) { showToast('Модель не содержит геометрии'); return; }

      const size   = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      model.position.sub(center);
      model.updateMatrixWorld(true);

      // Собираем все вершины для привязки (world coords, после центрирования)
      const v = new THREE.Vector3();
      const seenPos = new Set();
      model.traverse((obj) => {
        if (!obj.isMesh && !obj.isSkinnedMesh) return;
        const g = obj.geometry;
        if (!g || !g.attributes || !g.attributes.position) return;
        const pos = g.attributes.position;
        obj.updateMatrixWorld();
        for (let i = 0; i < pos.count; i++) {
          v.fromBufferAttribute(pos, i).applyMatrix4(obj.matrixWorld);
          // Округляем координаты, чтобы убрать дубликаты (3 знака после запятой)
          const key = v.x.toFixed(3) + '|' + v.y.toFixed(3) + '|' + v.z.toFixed(3);
          if (!seenPos.has(key)) {
            seenPos.add(key);
            allVertices.push(v.clone());
          }
        }
      });
      console.log('Вершин для привязки:', allVertices.length);

      const sphere = new THREE.Box3().setFromObject(model).getBoundingSphere(new THREE.Sphere());
      const r = Math.max(sphere.radius, 0.0001);

      const sc = keyLight.shadow.camera;
      sc.left = -r * 1.6; sc.right = r * 1.6;
      sc.top = r * 1.6;   sc.bottom = -r * 1.6;
      sc.near = r * 0.05; sc.far = r * 30;
      sc.updateProjectionMatrix();
      keyLight.position.copy(new THREE.Vector3(1, 1.7, 1).normalize().multiplyScalar(r * 6));
      keyLight.target.position.set(0, 0, 0);
      keyLight.target.updateMatrixWorld();

      buildGrid(r, -size.y / 2);

      const clips = collada.animations || [];
      if (clips.length) {
        currentMixer = new THREE.AnimationMixer(model);
        clips.forEach((clip) => {
          const a = currentMixer.clipAction(clip);
          a.setLoop(THREE.LoopRepeat, Infinity);
          a.play();
        });
      }

      currentModel = model;
      scene.add(currentModel);

      applyElementVisibility();
      applyGlassWalls();
      setHumanHeight(humanHeight);   // перерисуем человечка в новом масштабе

      ui.file.textContent   = fileName;
      ui.meshes.textContent = fmtInt(meshCount);
      ui.verts.textContent  = fmtInt(Math.round(vertCount));
      ui.tris.textContent   = fmtInt(Math.round(triCount));
      ui.size.textContent   = `${fmtNum(size.x)} × ${fmtNum(size.y)} × ${fmtNum(size.z)}`;

      if (clips.length) {
        ui.animRow.style.display = 'flex';
        ui.anims.textContent = fmtInt(clips.length);
      } else {
        ui.animRow.style.display = 'none';
      }

      infoEl.classList.add('show');
      panelEl.classList.remove('hidden');
      fitCamera();
    },
    (evt) => {
      if (evt && evt.total) {
        const p = Math.round((evt.loaded / evt.total) * 100);
        showProgress(p);
        setLoading(true, `Загрузка… ${p}%`);
      }
    },
    (err) => {
      setLoading(false);
      showProgress(0);
      console.error(err);
      showToast('Ошибка загрузки. Проверьте, что это корректный .dae');
    }
  );
}

/* ---------- Видимость элементов ---------- */
function applyElementVisibility() {
  for (const key in elementGroups) {
    const visible = elementVisible[key];
    elementGroups[key].forEach((obj) => { obj.visible = visible; });
  }
}

function applyGlassWalls() {
  elementGroups.wall.forEach((obj) => {
    const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
    const isWin = obj.userData.isWindow;
    mats.forEach((m) => {
      if (!m) return;
      if (glassWalls) {
        m.transparent = true;
        m.opacity = isWin ? WINDOW_OPACITY : WALL_OPACITY;
        m.depthWrite = false;
      } else {
        m.transparent = false;
        m.opacity = 1;
        m.depthWrite = true;
      }
      m.needsUpdate = true;
    });
  });

  elementGroups.opening.forEach((obj) => {
    const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
    mats.forEach((m) => {
      if (!m) return;
      if (glassWalls) {
        m.transparent = true;
        m.opacity = OPENING_OPACITY;
        m.depthWrite = false;
      } else {
        m.transparent = false;
        m.opacity = 1;
        m.depthWrite = true;
      }
      m.needsUpdate = true;
    });
  });
}

/* ---------- Камера ---------- */
function fitCamera() {
  if (!currentModel) return;
  const box = new THREE.Box3().setFromObject(currentModel);
  const sphere = box.getBoundingSphere(new THREE.Sphere());
  const radius = Math.max(sphere.radius, 0.0001);

  const fovRad = THREE.MathUtils.degToRad(camera.fov);
  const zoomFactor = isMobile() ? 0.78 : 1.18;
  const dist = (radius / Math.sin(fovRad / 2)) * zoomFactor;
  const dir = new THREE.Vector3(1, 0.62, 1).normalize();

  camera.position.copy(sphere.center).addScaledVector(dir, dist);
  camera.near = Math.max(radius / 500, 0.001);
  camera.far  = radius * 800;
  camera.updateProjectionMatrix();

  controls.target.copy(sphere.center);
  controls.minDistance = radius * 0.05;
  controls.maxDistance = radius * 60;
  controls.update();
}

/* ---------- Утилиты ---------- */
function disposeObject(root) {
  const textures = new Set();
  root.traverse((obj) => {
    if (obj.geometry) obj.geometry.dispose();
    const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
    mats.forEach((m) => {
      if (!m) return;
      for (const key in m) { const v = m[key]; if (v && v.isTexture) textures.add(v); }
      m.dispose();
    });
  });
  textures.forEach(t => t.dispose());
}

const fmtInt = (n) => new Intl.NumberFormat('ru-RU').format(n);
function fmtNum(v) {
  const a = Math.abs(v);
  if (a === 0) return '0';
  if (a >= 100) return v.toFixed(0);
  if (a >= 1) return v.toFixed(2);
  if (a >= 0.01) return v.toFixed(3);
  return v.toExponential(2);
}

let toastTimer = null;
function showToast(msg, ok = false) {
  toastEl.textContent = msg;
  toastEl.classList.toggle('ok', ok);
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 4000);
}
function setLoading(show, text) {
  if (text) loadingTxt.textContent = text;
  loadingEl.classList.toggle('show', show);
}

/* ═══════════════════════════════════════════════════════════════
   ПРИВЯЗКА К БЛИЖАЙШЕЙ ВЕРШИНЕ
   ═══════════════════════════════════════════════════════════════ */
function findNearestVertex(point, radius) {
  let bestDist = radius;
  let bestVert = null;
  for (let i = 0; i < allVertices.length; i++) {
    const d = point.distanceTo(allVertices[i]);
    if (d < bestDist) {
      bestDist = d;
      bestVert = allVertices[i];
    }
  }
  return bestVert;
}

/* ═══════════════════════════════════════════════════════════════
   ЛИНЕЙКА
   ═══════════════════════════════════════════════════════════════ */
function setRulerMode(on) {
  rulerMode = on;
  document.getElementById('btnRuler').classList.toggle('ruler-on', on);
  canvas.classList.toggle('ruler-mode', on);
  rulerHint.classList.toggle('show', on);

  // Режимы взаимоисключающие
  if (on && humanMode) setHumanMode(false);

  if (!on) {
    if (rulerPoints.length === 1) rulerPoints = [];
    snapDot.visible = false;
  }
}

function clearRuler() {
  rulerPoints = [];
  while (rulerGroup.children.length) {
    const c = rulerGroup.children.pop();
    if (c.geometry) c.geometry.dispose();
    if (c.material) {
      if (c.material.map) c.material.map.dispose();
      c.material.dispose();
    }
  }
}

function makeLabelSprite(text) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const dpr = 2;
  const W = 240, H = 70;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  ctx.fillStyle = 'rgba(20, 22, 30, 0.92)';
  ctx.strokeStyle = '#ff7043';
  ctx.lineWidth = 2;
  const r = 14;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(W - r, 0);
  ctx.quadraticCurveTo(W, 0, W, r);
  ctx.lineTo(W, H - r);
  ctx.quadraticCurveTo(W, H, W - r, H);
  ctx.lineTo(r, H);
  ctx.quadraticCurveTo(0, H, 0, H - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#ff9f43';
  ctx.font = '700 26px Inter, Segoe UI, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, W / 2, H / 2 + 1);

  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();

  const mat = new THREE.SpriteMaterial({
    map: tex, depthTest: false, depthWrite: false, transparent: true
  });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(0.7, 0.2, 1);
  return sprite;
}

function addMeasurePoint(point) {
  const dot = new THREE.Mesh(rulerDotGeo, rulerDotMat);
  dot.position.copy(point);
  dot.renderOrder = 999;
  rulerGroup.add(dot);
}

function addMeasureLine(p1, p2) {
  const geo = new THREE.BufferGeometry().setFromPoints([p1.clone(), p2.clone()]);
  const line = new THREE.Line(geo, rulerLineMat);
  line.renderOrder = 998;
  rulerGroup.add(line);
}

function formatDistance(distance) {
  const meters = distance * UNIT_SCALE;
  return (meters * 1000).toFixed(0) + ' мм';
}

function handleRulerTap(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);

  if (!currentModel) return;
  const hits = raycaster.intersectObject(currentModel, true);
  if (!hits.length) return;

  let point = hits[0].point.clone();
  // Привязка к ближайшей вершине
  const nearVert = findNearestVertex(point, SNAP_RADIUS);
  if (nearVert) point = nearVert.clone();

  rulerPoints.push(point);
  addMeasurePoint(point);

  if (rulerPoints.length === 2) {
    const p1 = rulerPoints[0];
    const p2 = rulerPoints[1];

    addMeasureLine(p1, p2);

    const dist = p1.distanceTo(p2);
    const labelText = formatDistance(dist);
    const sprite = makeLabelSprite(labelText);
    const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
    sprite.position.copy(mid);
    rulerGroup.add(sprite);

    rulerPoints = [];
  }
}

/* Подсветка при наведении (только ПК) */
function handleRulerHover(clientX, clientY) {
  if (!rulerMode || !currentModel) { snapDot.visible = false; return; }
  const rect = canvas.getBoundingClientRect();
  pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);

  const hits = raycaster.intersectObject(currentModel, true);
  if (!hits.length) { snapDot.visible = false; return; }

  const point = hits[0].point.clone();
  const nearVert = findNearestVertex(point, SNAP_RADIUS);
  if (nearVert) {
    snapDot.position.copy(nearVert);
    snapDot.visible = true;
  } else {
    snapDot.position.copy(point);
    snapDot.visible = true;
    snapDotMat.color.setHex(0xffffff);
    snapDotMat.opacity = 0.4;
    return;
  }
  snapDotMat.color.setHex(0xffd166);
  snapDotMat.opacity = 0.85;
}

/* ═══════════════════════════════════════════════════════════════
   ЧЕЛОВЕЧЕК
   ═══════════════════════════════════════════════════════════════ */
function setHumanMode(on) {
  humanMode = on;
  document.getElementById('btnHuman').classList.toggle('human-on', on);
  canvas.classList.toggle('human-mode', on);
  humanHint.classList.toggle('show', on);

  if (on && rulerMode) setRulerMode(false);
  if (!on) {
    // просто выключаем режим, человечек остаётся на месте
  }
}
function placeHuman(clientX, clientY) {
  if (!currentModel) return;
  const rect = canvas.getBoundingClientRect();
  pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);

  const hits = raycaster.intersectObject(currentModel, true);
  if (!hits.length) return;

  const point = hits[0].point.clone();
  humanGroup.position.copy(point);
  humanGroup.visible = true;
}

/* ---------- Обработчики мыши / тача ---------- */
let pointerDown = false;
let downX = 0, downY = 0;

canvas.addEventListener('pointerdown', (e) => {
  pointerDown = true;
  downX = e.clientX;
  downY = e.clientY;
});

canvas.addEventListener('pointerup', (e) => {
  if (!pointerDown) return;
  pointerDown = false;
  const dx = Math.abs(e.clientX - downX);
  const dy = Math.abs(e.clientY - downY);
  // считаем тапом, если сдвиг меньше 6 пикселей
  if (dx < 6 && dy < 6) {
    if (rulerMode) {
      handleRulerTap(e.clientX, e.clientY);
    } else if (humanMode) {
      placeHuman(e.clientX, e.clientY);
    }
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (rulerMode) handleRulerHover(e.clientX, e.clientY);
});

canvas.addEventListener('pointerleave', () => {
  snapDot.visible = false;
});

/* ---------- Инициализация панели ---------- */
if (isMobile()) {
  panelEl.classList.remove('hidden');
  panelEl.classList.remove('open');
} else {
  panelEl.classList.remove('hidden');
}

panelToggle.addEventListener('click', () => {
  const isOpen = panelEl.classList.toggle('open');
  panelToggle.classList.toggle('active', isOpen);
});

/* ---------- Кнопки ---------- */
document.getElementById('btnOpen').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => { handleFiles(e.target.files); fileInput.value = ''; });
document.getElementById('btnFit').addEventListener('click', fitCamera);

document.getElementById('btnRotate').addEventListener('click', (e) => {
  controls.autoRotate = !controls.autoRotate;
  e.currentTarget.classList.toggle('active', controls.autoRotate);
});

function bindElementButton(id, key) {
  const btn = document.getElementById(id);
  if (!btn) return;
  btn.addEventListener('click', () => {
    elementVisible[key] = !elementVisible[key];
    btn.classList.toggle('active', elementVisible[key]);
    applyElementVisibility();
  });
}

bindElementButton('el_treads',    'treads');
bindElementButton('el_risers',    'risers');
bindElementButton('el_stringers', 'stringers');
bindElementButton('el_railing',   'railing');
bindElementButton('el_wall',      'wall');
bindElementButton('el_opening',   'opening');
bindElementButton('el_floor',     'floor');

document.getElementById('btnGlass').addEventListener('click', (e) => {
  glassWalls = !glassWalls;
  e.currentTarget.classList.toggle('active', glassWalls);
  applyGlassWalls();
});

/* ---------- Линейка ---------- */
document.getElementById('btnRuler').addEventListener('click', () => {
  setRulerMode(!rulerMode);
});

document.getElementById('btnRulerClear').addEventListener('click', () => {
  clearRuler();
  showToast('Замеры очищены', true);
});

/* ---------- Человечек ---------- */
document.getElementById('btnHuman').addEventListener('click', () => {
  setHumanMode(!humanMode);
  if (humanMode && !humanGroup.visible && currentModel) {
    showToast('Тапните по ступени, чтобы поставить человечка', true);
  }
});

document.getElementById('btnHumanRemove').addEventListener('click', () => {
  humanGroup.visible = false;
  setHumanMode(false);
  showToast('Человечек убран', true);
});

heightSlider.addEventListener('input', (e) => {
  const cm = parseInt(e.target.value, 10);
  setHumanHeight(cm);
});

/* ---------- Сброс ---------- */
document.getElementById('btnReset').addEventListener('click', () => {
  for (const k in elementVisible) elementVisible[k] = true;
  for (const k in elementVisible) {
    const btn = document.getElementById('el_' + k);
    if (btn) btn.classList.add('active');
  }
  glassWalls = true;
  document.getElementById('btnGlass').classList.add('active');
  controls.autoRotate = false;
  document.getElementById('btnRotate').classList.remove('active');
  applyElementVisibility();
  applyGlassWalls();

  if (rulerMode) setRulerMode(false);
  if (humanMode) setHumanMode(false);
  humanGroup.visible = false;

  const bg = '#0f1116';
  document.getElementById('bgColor').value = bg;
  scene.background.set(bg);
  if (currentModel) fitCamera();
});

/* ---------- Снимок ---------- */
document.getElementById('btnShot').addEventListener('click', () => {
  renderer.render(scene, camera);
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = `view-${Date.now()}.png`;
  a.click();
  showToast('Снимок сохранён', true);
});

/* ---------- Поделиться ---------- */
document.getElementById('btnShare').addEventListener('click', async () => {
  const url = location.href.split('#')[0].split('?')[0];
  const title = document.title || '3D Viewer';

  if (navigator.share) {
    try {
      await navigator.share({ title, text: 'Посмотрите 3D-модель', url });
      return;
    } catch (e) {
      if (e && e.name === 'AbortError') return;
    }
  }
  try {
    await navigator.clipboard.writeText(url);
    showToast('Ссылка скопирована в буфер обмена', true);
  } catch {
    prompt('Скопируйте ссылку вручную:', url);
  }
});

document.getElementById('bgColor').addEventListener('input', (e) => {
  scene.background.set(e.target.value);
});

/* ---------- Drag & Drop ---------- */
let dragDepth = 0;
window.addEventListener('dragenter', (e) => { e.preventDefault(); dragDepth++; });
window.addEventListener('dragover', (e) => { e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy'; });
window.addEventListener('dragleave', (e) => { e.preventDefault(); dragDepth = Math.max(0, dragDepth - 1); });
window.addEventListener('drop', (e) => {
  e.preventDefault(); dragDepth = 0;
  if (e.dataTransfer && e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
});

/* ---------- Горячие клавиши ---------- */
window.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;
  switch (e.key.toLowerCase()) {
    case 'f': document.getElementById('btnFit').click(); break;
    case 'r': document.getElementById('btnRotate').click(); break;
    case 'm': document.getElementById('btnRuler').click(); break;
    case 'h': document.getElementById('btnHuman').click(); break;
  }
});

/* ---------- Ресайз ---------- */
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

/* ---------- Цикл ---------- */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  if (currentMixer) currentMixer.update(dt);
  controls.update();
  renderer.render(scene, camera);
}

/* ---------- Старт ---------- */
resize();
animate();

if (MODEL_FILE) {
  loadCollada(MODEL_FILE, MODEL_FILE);
}

console.log('%c◈ 3D Viewer готов', 'color:#5b8cff;font-weight:bold;font-size:14px');
console.log('Модель:', MODEL_FILE);
console.log('Линейка — M. Человечек — H.');
</script>
</body>
</html>
