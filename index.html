<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Viewer — диагностика 2</title>
<style>
  :root{--bg:#0f1116;--panel:rgba(22,25,33,.82);--border:rgba(255,255,255,.09);
    --text:#e9edf5;--muted:#8b95a8;--accent:#5b8cff;--accent-2:#31d0aa;--radius:14px;}
  *{box-sizing:border-box;}html,body{height:100%;margin:0;}
  body{font-family:'Inter','Segoe UI',system-ui,sans-serif;background:var(--bg);
    color:var(--text);overflow:hidden;}
  #canvas{display:block;width:100%;height:100%;touch-action:none;}
  .brand{position:fixed;top:18px;left:18px;display:flex;align-items:center;gap:12px;
    padding:10px 16px;background:var(--panel);border:1px solid var(--border);
    border-radius:var(--radius);backdrop-filter:blur(14px);z-index:20;pointer-events:none;}
  .logo{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));font-size:17px;
    color:#0b0d12;font-weight:800;}
  .brand h1{margin:0;font-size:14px;font-weight:650;}
  .brand p{margin:2px 0 0;font-size:11px;color:var(--muted);}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<header class="brand">
  <div class="logo">◈</div>
  <div><h1>Диагностика 2</h1><p>Меши, узлы и материалы</p></div>
</header>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { ColladaLoader } from 'three/addons/loaders/ColladaLoader.js';

const MODEL_FILE = 'Korobitsyno.dae';  // ← имя вашей модели

const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#0f1116');

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 10000);
camera.position.set(4, 3, 5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xdfe9ff, 0x2a2f3a, 1.6));
const key = new THREE.DirectionalLight(0xffffff, 2.6);
key.position.set(5, 9, 7);
scene.add(key);
const fill = new THREE.DirectionalLight(0xa8c4ff, 0.9);
fill.position.set(-7, 4, -6);
scene.add(fill);

const loader = new ColladaLoader();
loader.load(MODEL_FILE, (collada) => {
  const model = collada.scene;
  scene.add(model);

  // Центрируем и ставим камеру
  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  model.position.sub(center);

  const sphere = new THREE.Box3().setFromObject(model).getBoundingSphere(new THREE.Sphere());
  const r = Math.max(sphere.radius, 0.0001);
  const dist = (r / Math.sin(THREE.MathUtils.degToRad(camera.fov) / 2)) * 1.2;
  camera.position.copy(new THREE.Vector3(1, 0.6, 1).normalize().multiplyScalar(dist));
  camera.near = r / 500;
  camera.far = r * 800;
  camera.updateProjectionMatrix();
  controls.target.set(0, 0, 0);

  // ═══════════════════════════════════════════════════════════
  // Собираем данные
  // ═══════════════════════════════════════════════════════════
  const nodes = [];
  const meshes = [];
  const materialMap = new Map(); // materialName → { count, examples[] }

  model.traverse((obj) => {
    // Узлы (любые объекты с непустым именем)
    if (obj.name) {
      nodes.push({ name: obj.name, type: obj.type });
    }

    // Меши
    if (obj.isMesh || obj.isSkinnedMesh) {
      const parentName = obj.parent && obj.parent.name ? obj.parent.name : '(без имени)';
      let geo = obj.geometry;
      let verts = geo && geo.attributes.position ? geo.attributes.position.count : 0;
      let tris = 0;
      if (geo) {
        tris = geo.index ? geo.index.count / 3 : verts / 3;
      }

      const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
      const matNames = mats.map(m => m && m.name ? m.name : '(без имени)');
      const matIds = mats.map(m => m && m.uuid ? m.uuid.slice(0, 6) : '?');

      meshes.push({
        mesh: obj.name || '(без имени)',
        parent: parentName,
        verts: verts,
        tris: Math.round(tris),
        materials: matNames.join(', ')
      });

      // Считаем материалы
      mats.forEach((m) => {
        if (!m) return;
        const key = m.name || '(без имени)';
        if (!materialMap.has(key)) {
          materialMap.set(key, { count: 0, examples: [], color: m.color ? '#' + m.color.getHexString() : '—' });
        }
        const rec = materialMap.get(key);
        rec.count++;
        if (rec.examples.length < 5) {
          rec.examples.push(obj.name || '(без имени)');
        }
      });
    }
  });

  // ═══════════════════════════════════════════════════════════
  // ВЫВОД В КОНСОЛЬ
  // ═══════════════════════════════════════════════════════════

  console.log('%c═══════════════════════════════════════', 'color:#5b8cff');
  console.log('%c ДИАГНОСТИКА 2 — МЕШИ, УЗЛЫ, МАТЕРИАЛЫ', 'color:#5b8cff;font-weight:bold;font-size:14px');
  console.log('%c═══════════════════════════════════════', 'color:#5b8cff');

  console.log('%c─── 1. УЗЛЫ (' + nodes.length + ') ───', 'color:#31d0aa;font-weight:bold');
  console.table(nodes);

  console.log('%c─── 2. МЕШИ (' + meshes.length + ') ───', 'color:#31d0aa;font-weight:bold');
  console.table(meshes);

  console.log('%c─── 3. МАТЕРИАЛЫ (' + materialMap.size + ') ───', 'color:#31d0aa;font-weight:bold');
  const matTable = [];
  materialMap.forEach((rec, name) => {
    matTable.push({
      material: name,
      color: rec.color,
      meshCount: rec.count,
      examples: rec.examples.join(', ')
    });
  });
  console.table(matTable);

  console.log('%c═══════════════════════════════════════', 'color:#5b8cff');
  console.log('%c Скопируйте все три таблицы и пришлите мне.', 'color:#31d0aa');
}, undefined, (err) => {
  console.error('Ошибка загрузки:', err);
});

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
})();

console.log('%c◈ Диагностика 2 запущена', 'color:#5b8cff;font-weight:bold');
</script>
</body>
</html>
